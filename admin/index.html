<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>MyFlowersGarden — панель управления</title>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <div id="nc-root"></div>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    /* ============================================================
       Кастомный предпросмотр каталога товаров.
       ============================================================ */

    var ProductsPreview = createClass({
      render: function () {
        var entry = this.props.entry;
        var getAsset = this.props.getAsset;
        var items = entry.getIn(['data', 'items']);

        if (!items || items.size === 0) {
          return h('div', { className: 'preview-stage' },
            h('p', { className: 'preview-stage__label' }, 'Каталог букетов'),
            h('div', { className: 'preview-empty' }, 'Пока нет ни одного товара — добавьте первый в списке слева.')
          );
        }

        var cards = items.map(function (item, index) {
          var title = item.get('title') || 'Без названия';
          var desc = item.get('desc') || '';
          var price = item.get('price');
          var unit = item.get('unit') || '';
          var tag = item.get('tag') || '';
          var category = item.get('category') || '';
          var imgPath = item.get('img');
          var imgSrc = imgPath ? getAsset(imgPath) : null;

          var tagNode = tag
            ? h('span', {
                className: 'product-card__tag' + (category === 'premium' ? ' product-card__tag--gold' : '')
              }, tag)
            : null;

          var mediaNode = imgSrc
            ? h('img', { src: imgSrc, alt: title })
            : h('div', { className: 'product-card__media--empty' }, 'Загрузите фото букета');

          var priceNode = (price !== undefined && price !== null && price !== '')
            ? h('span', { className: 'price' },
                price.toLocaleString ? price.toLocaleString('ru-RU') : price,
                '\u00A0₽',
                unit ? h('span', { className: 'product-card__unit' }, unit) : null
              )
            : h('span', { className: 'price' }, '— ₽');

          return h('article', { className: 'product-card', key: item.get('id') || index },
            h('div', { className: 'product-card__media' }, mediaNode, tagNode),
            h('div', { className: 'product-card__body' },
              h('h3', { className: 'product-card__title' }, title),
              h('p', { className: 'product-card__desc' }, desc),
              h('div', { className: 'product-card__footer' },
                priceNode,
                h('button', { className: 'btn btn--cart', type: 'button' }, 'В корзину')
              )
            )
          );
        }).toArray();

        return h('div', { className: 'preview-stage' },
          h('p', { className: 'preview-stage__label' }, 'Каталог букетов — как на сайте'),
          h('div', { className: 'preview-grid' }, cards)
        );
      }
    });

    CMS.registerPreviewTemplate('products', ProductsPreview);
    CMS.registerPreviewStyle('preview.css');
  </script>
</body>
</html>
